<title>Southampton Reports</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: calm single column. Header, clickable summary, clickable category chart, one compact toolbar, list grouped by day. */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --ink:#14202b; --ink2:#4a5866; --ink3:#7b8895; --line:#e3e8ed; --line2:#cfd7df;
  --accent:#1d5f8f; --accent-soft:#e3eef6; --on-accent:#ffffff;
  --ok:#1f7a4d; --ok-soft:#e1f1e8; --warn:#92580a; --warn-soft:#fbefd9; --crit:#a3262a; --crit-soft:#f9e3e3;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --f-body:"Hanken Grotesk","Segoe UI",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161d; --surface:#17212b; --ink:#e8eef3; --ink2:#a9b6c2; --ink3:#7d8b98; --line:#26323e; --line2:#35444f;
  --accent:#6fb3e3; --accent-soft:#1d3447; --on-accent:#0f161d; --ok:#6fd0a0; --ok-soft:#1b3a2d; --warn:#f0b866; --warn-soft:#3b2d14; --crit:#f08a8c; --crit-soft:#40201f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161d; --surface:#17212b; --ink:#e8eef3; --ink2:#a9b6c2; --ink3:#7d8b98; --line:#26323e; --line2:#35444f;
  --accent:#6fb3e3; --accent-soft:#1d3447; --on-accent:#0f161d; --ok:#6fd0a0; --ok-soft:#1b3a2d; --warn:#f0b866; --warn-soft:#3b2d14; --crit:#f08a8c; --crit-soft:#40201f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:24px 56px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--f-display);font-size:1.7rem;margin:0;letter-spacing:-.015em;text-wrap:balance}
.sub{color:var(--ink2);font-size:.92rem;margin-top:3px}
.tabs{display:inline-flex;background:var(--line);border-radius:10px;padding:3px;gap:2px}
.tabs button{border:0;background:none;color:var(--ink2);font:600 .86rem var(--f-body);padding:7px 15px;border-radius:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.demo{font-size:.8rem;color:var(--ink2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;cursor:pointer;font:inherit;color:inherit;transition:border-color .15s}
.kpi:hover{border-color:var(--line2)}.kpi[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.kpi b{display:block;font:700 1.75rem var(--f-display);font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{color:var(--ink2);font-size:.82rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
h2{font:700 1.05rem var(--f-display);margin:0}
.hint{font-size:.8rem;color:var(--ink3)}
.bars{display:flex;flex-direction:column;gap:2px}
.bar{display:grid;grid-template-columns:minmax(110px,230px) 1fr 28px;gap:12px;align-items:center;font:inherit;font-size:.86rem;background:none;border:0;color:inherit;text-align:left;padding:4px 6px;border-radius:8px;cursor:pointer;width:100%}
.bar:hover{background:var(--bg)}.bar[aria-pressed="true"]{background:var(--accent-soft)}
.bar .name{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .fill{display:block;height:10px;background:var(--accent);border-radius:0 4px 4px 0;min-width:3px}
.bar .n{font-variant-numeric:tabular-nums;text-align:right}
.toolbar{display:flex;flex-direction:column;gap:12px;margin-bottom:6px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select,input[type=text]{font:500 .88rem var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 11px;max-width:100%}
#f-q{flex:1 1 240px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .lab{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);margin-right:4px}
.tg{font:600 .82rem var(--f-body);background:var(--surface);color:var(--ink2);border:1px solid var(--line2);border-radius:99px;padding:5px 12px;cursor:pointer}
.tg[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.count{font-size:.84rem;color:var(--ink2);margin-left:auto}
.link{background:none;border:0;color:var(--accent);font:600 .84rem var(--f-body);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
.tablewrap{overflow-x:auto;margin-top:6px}
table{border-collapse:collapse;width:100%;min-width:780px;font-size:.88rem}
th{font:600 .7rem var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);text-align:left;padding:8px 10px}
td{padding:11px 10px;border-top:1px solid var(--line);vertical-align:middle}
tr.day td{border-top:0;padding:18px 10px 6px;font:700 .82rem var(--f-display);color:var(--ink2)}
tr.day td span{font-weight:500;color:var(--ink3);margin-left:6px}
tbody tr:not(.day):hover td{background:var(--bg)}
.id{font-family:var(--f-mono);font-size:.78rem;color:var(--ink2)}
.chip{display:inline-flex;gap:6px;align-items:center;font-size:.76rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.high{background:var(--crit-soft);color:var(--crit)}.medium{background:var(--warn-soft);color:var(--warn)}.low{background:var(--accent-soft);color:var(--accent)}
.s-new{background:var(--accent-soft);color:var(--accent)}.s-in_review{background:var(--warn-soft);color:var(--warn)}.s-resolved{background:var(--ok-soft);color:var(--ok)}
.dup{font-size:.76rem;color:var(--ink3)}
td select{padding:5px 8px;font-size:.84rem}
.empty{padding:34px 10px;text-align:center;color:var(--ink2)}
.phone{max-width:400px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.card h2{font-size:1.25rem;margin:2px 0 8px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.9rem;margin:16px 0}
.meta dt{color:var(--ink3)}.meta dd{margin:0;overflow-wrap:anywhere}
.steps{list-style:none;margin:18px 0 0;padding:0}
.steps li{display:grid;grid-template-columns:22px 1fr;gap:10px;position:relative;padding-bottom:16px;color:var(--ink3);font-size:.9rem}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);background:var(--surface);display:grid;place-items:center;font-size:.7rem;z-index:1}
.steps li.done{color:var(--ink)}.steps li.done .dot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.steps b{display:block;font-weight:600}
.urlbar{font-family:var(--f-mono);font-size:.74rem;color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:7px 14px;overflow-wrap:anywhere}
.tokenrow{display:flex;gap:10px;align-items:center}.tokenrow input{flex:1;min-width:0;font-family:var(--f-mono)}
.note{font-size:.8rem;color:var(--ink3)}
.err{color:var(--crit);font-weight:600}
@media (max-width:560px){.bar{grid-template-columns:96px 1fr 24px}.count{margin-left:0;width:100%}}
</style>
<div class="wrap">
<header>
  <div><h1>Southampton Reports</h1><div class="sub" id="sub"></div></div>
  <div class="tabs" role="tablist" aria-label="View">
    <button role="tab" id="tab-council" aria-selected="true">Council view</button>
    <button role="tab" id="tab-resident" aria-selected="false">Resident view</button>
  </div>
</header>
<div class="demo">Demo with synthetic reports. None of these are real residents or incidents.</div>
<main id="view"></main>
</div>

    <button class="kpi" data-f="hideDup" data-v="toggle" aria-pressed="${state.hideDup}"><b>${DATA.filter(r=>r.duplicate_of).length}</b><span>Repeat reports${state.hideDup?" (hidden)":""}</span></button>
  </div>
  <div class="panel"><div class="ph"><h2>Reports by category</h2><span class="hint">Select a bar to filter the list</span></div>
    <div class="bars">${entries.map(([id,c])=>`<button class="bar" data-f="cat" data-v="${id}" aria-pressed="${state.cat===id}"><span class="name" title="${esc(label(id))}">${esc(label(id))}</span><span><span class="fill" style="width:${c/max*100}%"></span></span><span class="n">${c}</span></button>`).join("")}</div>
  </div>
  <div class="panel"><div class="ph"><h2>All reports</h2></div>
    <div class="toolbar">
      <div class="row">
        <input type="text" id="f-q" placeholder="Search street, ID or category" value="${esc(state.q)}" aria-label="Search">
        <select id="f-range" aria-label="Date range">${[["all","All time"],["1","Last 24 hours"],["7","Last 7 days"],["30","Last 30 days"]].map(([v,t])=>`<option value="${v}" ${state.range===v?"selected":""}>${t}</option>`).join("")}</select>
        <select id="f-sort" aria-label="Sort by">${[["newest","Newest first"],["oldest","Oldest first"],["severity","Most severe first"],["street","Street A to Z"]].map(([v,t])=>`<option value="${v}" ${state.sort===v?"selected":""}>${t}</option>`).join("")}</select>
        <select id="f-cat" aria-label="Category"><option value="all">All categories</option>${Object.keys(count).sort((a,b)=>label(a).localeCompare(label(b))).map(k=>`<option value="${k}" ${state.cat===k?"selected":""}>${esc(label(k))}</option>`).join("")}</select>
      </div>
      <div class="row">
        <div class="chips"><span class="lab">Severity</span>${tg("sev","high","High")}${tg("sev","medium","Medium")}${tg("sev","low","Low")}</div>
        <div class="chips"><span class="lab">Photo</span>${tg("photo","1","With photo")}${tg("photo","0","No photo")}</div>
        <div class="chips">${tg("hideDup","toggle","Hide repeats").replace(`aria-pressed="${state.hideDup===false}"`,`aria-pressed="${state.hideDup}"`)}</div>
        <span class="count">${rows.length} of ${DATA.length} reports${active?` <button class="link" id="f-reset">Clear ${active} filter${active>1?"s":""}</button>`:""}</span>
      </div>
    </div>
    <div class="tablewrap"><table><thead><tr><th>Report</th><th>Category</th><th>Location</th><th>Severity</th><th>Status</th><th>Photo</th><th></th></tr></thead><tbody>${body}</tbody></table></div>
  </div>`;
}
function resident(){
  const r=DATA.find(x=>x.link_token===state.token.trim());
  const idx={new:0,in_review:1,resolved:2};let card;
  if(!r){card=`<div class="card"><h2>We can't find that report</h2><p class="err">The link may be incomplete.</p><p>Check the link in your message and try again. If you still need help, contact Southampton City Council through its website.</p></div>`}
  else{const i=idx[r.status];
    const st=[["Received","We have your report."],["In review","A council officer is looking at it."],["Resolved","The council has closed this report."]];
    card=`<div class="card"><div class="id">${r.id}</div><h2>${esc(label(r.category_id))}</h2>${chip("s-"+r.status,STATUS[r.status],true)}
    <dl class="meta"><dt>Where</dt><dd>${esc(r.location)}</dd><dt>Reported</dt><dd>${fmt(r.created_at)}</dd><dt>Details</dt><dd>${esc(r.description.replace("Synthetic example: ",""))}</dd></dl>
    ${r.duplicate_of?`<p class="note">Someone has already reported this. We joined your report to it so the council only handles it once.</p>`:""}
    <ol class="steps">${st.map((s,k)=>`<li class="${k<=i?"done":""}"><span class="dot">${k<=i?"✓":""}</span><span><b>${s[0]}</b>${k<=i?s[1]:""}</span></li>`).join("")}</ol></div>`}
  return `<div class="phone"><div class="urlbar">southampton-reports.example/r/${esc(state.token.trim()||"…")}</div>
    <div class="tokenrow"><input type="text" id="tok" value="${esc(state.token)}" aria-label="Link code" spellcheck="false"><button class="link" id="tokgo">View</button></div>
    ${card}<p class="note">This page shows only the report that belongs to this link.</p></div>`;
}
function render(){
  $("#sub").textContent=state.view==="council"?"Council view. Every report the assistant has saved.":"Resident view. What a resident sees when they open their link.";
  $("#tab-council").setAttribute("aria-selected",state.view==="council");$("#tab-resident").setAttribute("aria-selected",state.view==="resident");
  $("#view").style.cssText="display:flex;flex-direction:column;gap:20px";
  $("#view").innerHTML=state.view==="council"?council():resident();
  if(state.view==="council"){
    document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{const k=b.dataset.f,v=b.dataset.v;
      if(v==="toggle")state[k]=!state[k];else state[k]=state[k]===v&&v!=="all"?"all":v;render()});
    const sel=(id,k)=>{$(id).onchange=e=>{state[k]=e.target.value;render()}};
    sel("#f-range","range");sel("#f-sort","sort");sel("#f-cat","cat");
    $("#f-q").oninput=e=>{state.q=e.target.value;const p=e.target.selectionStart;render();const q=$("#f-q");q.focus();q.setSelectionRange(p,p)};
    const rs=$("#f-reset");if(rs)rs.onclick=()=>{Object.assign(state,blank);render()};
    document.querySelectorAll("select[data-id]").forEach(s=>s.onchange=e=>{DATA.find(r=>r.id===s.dataset.id).status=e.target.value;render()});
    document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{state.token=b.dataset.open;state.view="resident";render();window.scrollTo(0,0)});
  }else{
    const go=()=>{state.token=$("#tok").value;render()};
    $("#tokgo").onclick=go;$("#tok").onkeydown=e=>{if(e.key==="Enter")go()};
  }
}
$("#tab-council").onclick=()=>{state.view="council";render()};
$("#tab-resident").onclick=()=>{state.view="resident";render()};
render();
</script>
